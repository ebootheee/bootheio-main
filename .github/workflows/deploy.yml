name: Deploy

# Deploys on every push to main (so GitHub-web edits to posts go live without
# a terminal), and stays manually triggerable from the Actions tab. Secrets
# come from Infisical /bootheio-main via `secret sync --apply`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The engine in src/lib/palletballet-engine is a generated copy of
      # physics-sim/web/src. This can't check it against upstream (that repo
      # isn't here) but it does catch someone editing the vendored copy in
      # place, which would be lost on the next sync.
      - name: Verify vendored engine
        run: pnpm run verify-engine

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
